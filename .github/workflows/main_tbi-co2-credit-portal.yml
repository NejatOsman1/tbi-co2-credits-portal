# .github/workflows/deploy.yml
name: Build and deploy Vite app to Azure Web App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DEPLOY_DIR: deploy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'    # Node 20 LTS is safe for Vite 5
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run build:server
      - name: Remove dev-only dependencies from node_modules
        run: npm prune --omit=dev
      - name: Assemble deploy package
        run: |
          mkdir -p ${{ env.DEPLOY_DIR }}
          cp -r dist ${{ env.DEPLOY_DIR }}/dist
          cp -r server-dist ${{ env.DEPLOY_DIR }}/server-dist
          cp -r node_modules ${{ env.DEPLOY_DIR }}/node_modules
          cp package.json ${{ env.DEPLOY_DIR }}/package.json
          cp package-lock.json ${{ env.DEPLOY_DIR }}/package-lock.json
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-build
          path: ${{ env.DEPLOY_DIR }}    # 👈 upload the whole deploy package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-build
          path: ./${{ env.DEPLOY_DIR }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5B951500C6D4455F96D680430A2FE3F3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DAB6D32D71914B7C9568E255A35F160A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_225148546A4A43789652EE3D43FD3C38 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TBI-CO2-Credit-Portal'
          slot-name: 'production'
          package: ./${{ env.DEPLOY_DIR }}    # 👈 deploy dist/ + server-dist/ + node_modules/ + package.json
